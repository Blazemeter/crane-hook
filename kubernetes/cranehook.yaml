# Source: helm-crane/templates/tests/testhook.yaml
apiVersion: v1
kind: Pod
metadata:
  name: cranehook
  namespace: default
spec:
  serviceAccountName: default
  automountServiceAccountToken: true
  containers:
  - name: cranehook-ctr
    securityContext:
      runAsUser: 1337
      runAsGroup: 1337
      allowPrivilegeEscalation: false
      runAsNonRoot: true
    env: 
    #Check ENV used in the ReadMe
    - name: WORKING_NAMESPACE
      value: default
    - name: ROLE_NAME
      value: basic
    - name: ROLE_BINDING_NAME
      value: basic-binding
    - name: SERVICE_ACCOUNT_NAME
      value: default
    #- name: KUBERNETES_WEB_EXPOSE_TYPE
    #  value: <ingress-type>
    - name: DOCKER_REGISTRY
      value: "gcr.io/verdant-bulwark-278"  
    - name: KUBERNETES_NODE_SELECTOR_JSON
      value: >-{"node1": "value1"}
  
    #- name: KUBERNETES_WEB_EXPOSE_TLS_SECRET_NAME
    #  value: <tls-secret-name>
    image: "local/cranehook:latest"
    imagePullPolicy: "Never"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
    volumeMounts:
      - name: testhook-tmp
        mountPath: /tmp/testhook
  volumes:
    - name: testhook-tmp
      emptyDir: {}
  restartPolicy: "Never"
